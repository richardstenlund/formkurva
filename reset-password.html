<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formkurva | Återställ lösenord</title>
  <style>
    :root{--ink:#17221d;--muted:#6f7d76;--paper:#f5f6f1;--white:#fff;--line:#dfe5dd;--green:#1c5b48;--orange:#e47a40}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px sans-serif;color:var(--ink)}main{max-width:520px;margin:80px auto;padding:24px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px rgba(18,62,50,.06)}h1{margin:0 0 8px;font-size:32px}p{margin:0 0 18px;color:var(--muted)}label{display:block;margin-bottom:12px;font-weight:600}input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:6px}button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--green);color:#fff;font:700 15px sans-serif;cursor:pointer}.message{margin-top:14px;padding:10px 12px;border-radius:8px;background:#eef6f2;color:var(--green);display:none}.message.error{background:#fff1ee;color:#aa542f}.message.show{display:block}.muted{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <h1>Återställ lösenord</h1>
    <p>Välj ett nytt lösenord för ditt konto.</p>
    <form id="reset-form">
      <label>E-post<input type="email" name="email" id="email" required></label>
      <label>Återställningskod<input type="text" name="token" id="token" required></label>
      <label>Nytt lösenord<input type="password" name="newPassword" id="newPassword" minlength="8" required></label>
      <button type="submit">Spara nytt lösenord</button>
    </form>
    <div class="message" id="message"></div>
    <p class="muted">Om länken inte fyller i formuläret manuellt kan du klistra in koden från e-postmeddelandet.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const emailInput = document.getElementById('email');
    const tokenInput = document.getElementById('token');
    if (params.get('email')) emailInput.value = params.get('email');
    if (params.get('token')) tokenInput.value = params.get('token');

    const form = document.getElementById('reset-form');
    const message = document.getElementById('message');
    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
      message.classList.add('show');
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = { email: emailInput.value.trim(), token: tokenInput.value.trim(), newPassword: document.getElementById('newPassword').value };
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({ error: 'Kunde inte återställa lösenordet.' }));
        if (!response.ok) throw new Error(data.error || 'Kunde inte återställa lösenordet.');
        showMessage(data.message || 'Lösenordet är återställt.');
        form.reset();
        setTimeout(() => { location.href = '/'; }, 2000);
      } catch (error) {
        showMessage(error.message, true);
      }
    });
  </script>
</body>
</html>
