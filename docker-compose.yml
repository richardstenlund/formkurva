services:
  formkurva:
    build: .
    container_name: formkurva
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_DAYS: 30
      SECURE_COOKIES: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - formkurva_data:/data

volumes:
  formkurva_data:
