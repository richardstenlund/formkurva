services:
  db:
    image: postgres:16-alpine
    container_name: formkurva-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
  formkurva:
    build: .
    container_name: formkurva
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_DAYS: 30
      SECURE_COOKIES: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Formkurva <noreply@localhost>}
    depends_on:
      db:
        condition: service_healthy
  adminer:
    image: adminer:4
    container_name: formkurva-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DB: ${DB_NAME}
      ADMINER_DEFAULT_DRIVER: pgsql
    depends_on:
      db:
        condition: service_healthy
  backup:
    image: postgres:16-alpine
    container_name: formkurva-backup
    restart: unless-stopped
    volumes:
      - formkurva_backups:/backups
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c 'while true; do pg_dump -h db -U "$${DB_USER}" -d "$${DB_NAME}" | gzip > /backups/formkurva-$$(date +%Y-%m-%d-%H%M).sql.gz; find /backups -type f -mtime +14 -delete; sleep 86400; done'

volumes:
  postgres_data:
  formkurva_backups:
