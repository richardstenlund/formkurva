<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formkurva | Admin</title>
  <style>
    :root{--ink:#17221d;--muted:#6f7d76;--paper:#f5f6f1;--white:#fff;--line:#dfe5dd;--green:#1c5b48;--dark:#123e32;--orange:#e47a40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}main{max-width:1100px;margin:auto;padding:42px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}h1,h2{font-family:'Space Grotesk',sans-serif;margin:0}h1{font-size:38px}.eyebrow{color:var(--orange);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.back{color:var(--green);font-weight:700;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat,.panel{border:1px solid var(--line);border-radius:12px;background:var(--white);box-shadow:0 14px 35px #1e392b0d}.stat{padding:20px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font:700 30px 'Space Grotesk',sans-serif}.panel{padding:24px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{color:var(--muted);font-size:10px;text-align:left;text-transform:uppercase;padding:0 10px 12px}.table td{border-top:1px solid #edf0ec;padding:13px 10px}.table th:first-child,.table td:first-child{padding-left:0}.role,.action{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink);font:inherit;font-size:11px}.remove{border-color:#e3b5a2;background:#fff8f4;color:#aa542f}.message{color:var(--muted);font-size:12px}.error{color:#aa542f}.ok{color:var(--green)}@media(max-width:650px){main{padding:25px 15px}.top{align-items:flex-start;flex-direction:column}h1{font-size:31px}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body><main><div class="top"><div><p class="eyebrow">Kontrollpanel</p><h1>Admin</h1><p class="sub">Hantera konton och behörigheter.</p></div><a class="back" href="/">← Till Formkurva</a></div><section class="stats"><div class="stat"><span>Konton</span><strong id="user-count">–</strong></div><div class="stat"><span>Administratörer</span><strong id="admin-count">–</strong></div><div class="stat"><span>Totala mätningar</span><strong id="measurement-count">–</strong></div></section><section class="panel"><div class="heading"><div><h2>Användare</h2><p class="sub">Ändra roller, logga ut eller radera konton.</p></div></div><div id="message" class="message">Laddar...</div><div class="table-wrap"><table class="table"><thead><tr><th>E-post</th><th>Skapad</th><th>Mätningar</th><th>Roll</th><th>Åtgärder</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>
const api=async(path,options={})=>{const r=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error((await r.json().catch(()=>({error:'Serverfel'}))).error);return r.status===204?null:r.json()};const message=document.getElementById('message');
async function load(){try{const me=await api('/me');if(!me.user||me.user.role!=='admin'){location.href='/';return}const stats=await api('/admin/stats');document.getElementById('user-count').textContent=stats.users;document.getElementById('admin-count').textContent=stats.admins;document.getElementById('measurement-count').textContent=stats.measurements;const result=await api('/admin/users');document.getElementById('users').innerHTML=result.users.map(u=>`<tr><td>${u.email}</td><td>${new Date(u.created_at).toLocaleDateString('sv-SE')}</td><td>${u.measurement_count}</td><td><select class="role" data-id="${u.id}" data-old="${u.role}" ${u.id===me.user.id?'disabled':''}><option value="user" ${u.role==='user'?'selected':''}>Vanlig användare</option><option value="admin" ${u.role==='admin'?'selected':''}>Administratör</option></select></td><td><button class="action" data-logout="${u.id}">Logga ut</button> <button class="action remove" data-delete="${u.id}" ${u.id===me.user.id?'disabled':''}>Radera</button></td></tr>`).join('');document.querySelectorAll('.role').forEach(e=>e.addEventListener('change',async()=>{try{await api('/admin/users/'+e.dataset.id+'/role',{method:'PATCH',body:JSON.stringify({role:e.value})});e.dataset.old=e.value;message.textContent='Rollen är uppdaterad.';message.className='message ok'}catch(err){e.value=e.dataset.old;message.textContent=err.message;message.className='message error'}}));document.querySelectorAll('[data-logout]').forEach(e=>e.addEventListener('click',async()=>{try{await api('/admin/users/'+e.dataset.logout+'/logout',{method:'POST'});message.textContent='Användaren loggades ut från alla enheter.';message.className='message ok'}catch(err){message.textContent=err.message;message.className='message error'}}));document.querySelectorAll('[data-delete]').forEach(e=>e.addEventListener('click',async()=>{if(!confirm('Radera kontot och all tillhörande data?'))return;try{await api('/admin/users/'+e.dataset.delete,{method:'DELETE'});load()}catch(err){message.textContent=err.message;message.className='message error'}}));message.textContent='';}catch(err){message.textContent=err.message;message.className='message error'}}load();
</script></body></html>
